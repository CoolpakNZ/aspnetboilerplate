name: "build and test"

on:
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.cshtml'
      - '**/*.csproj'
      - '**/*.razor'
      # The SDK now comes from global.json, and publish-packages triggers on it too.
      # Without this an SDK-only change would publish without ever running the tests.
      - 'global.json'
      - 'common.props'
      - 'Directory.Build.props'
      - 'test/Directory.Build.props'

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
